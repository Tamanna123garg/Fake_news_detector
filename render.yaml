services:
  - type: web
    name: fake-news-detector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m src.train && python -m src.train_text
    startCommand: gunicorn app:app --workers 1 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
